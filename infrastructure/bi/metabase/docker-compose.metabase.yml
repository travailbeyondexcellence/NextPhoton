# NextPhoton Metabase Business Intelligence Configuration
# Self-hosted dashboards and reporting platform
#
# Usage:
#   docker-compose -f docker-compose.metabase.yml up -d
#
# Environment Variables Required:
#   - MB_DB_PASS: Metabase database password
#   - MB_ENCRYPTION_SECRET_KEY: Encryption key (generate with: openssl rand -base64 32)
#
# Access Metabase at: http://localhost:3001
# First user to login becomes admin

version: '3.8'

services:
  # =============================================================================
  # Metabase Application Server
  # =============================================================================
  metabase:
    image: metabase/metabase:v0.48.0
    container_name: nextphoton-metabase
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      # Application Database (stores Metabase metadata)
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASS:-metabase_password}
      MB_DB_HOST: metabase-db

      # Security Settings
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:-change_this_in_production}
      MB_PASSWORD_COMPLEXITY: strong
      MB_PASSWORD_LENGTH: 10

      # Site Configuration
      MB_SITE_NAME: NextPhoton Analytics
      MB_SITE_URL: ${MB_SITE_URL:-http://localhost:3001}
      MB_SITE_LOCALE: en

      # Email Configuration (for alerts and subscriptions)
      MB_EMAIL_SMTP_HOST: ${MB_EMAIL_SMTP_HOST:-}
      MB_EMAIL_SMTP_PORT: ${MB_EMAIL_SMTP_PORT:-587}
      MB_EMAIL_SMTP_USERNAME: ${MB_EMAIL_SMTP_USERNAME:-}
      MB_EMAIL_SMTP_PASSWORD: ${MB_EMAIL_SMTP_PASSWORD:-}
      MB_EMAIL_SMTP_SECURITY: tls
      MB_EMAIL_FROM_ADDRESS: ${MB_EMAIL_FROM_ADDRESS:-analytics@nextphoton.com}
      MB_EMAIL_FROM_NAME: NextPhoton Analytics

      # Embedding Settings
      MB_ENABLE_EMBEDDING: "true"
      MB_EMBEDDING_SECRET_KEY: ${MB_EMBEDDING_SECRET_KEY:-your_embedding_secret}

      # Performance Settings
      JAVA_OPTS: "-Xmx2g -Xms512m"

      # Timezone
      MB_TIMEZONE: UTC

      # Session settings
      MAX_SESSION_AGE: 20160

      # Public sharing (disabled by default for security)
      MB_ENABLE_PUBLIC_SHARING: "false"

    volumes:
      - metabase_data:/metabase-data
    networks:
      - nextphoton-bi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # =============================================================================
  # PostgreSQL Database (Metabase Application Database)
  # =============================================================================
  metabase-db:
    image: postgres:14-alpine
    container_name: nextphoton-metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${MB_DB_PASS:-metabase_password}
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    networks:
      - nextphoton-bi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  metabase_data:
    name: nextphoton_metabase_data
  metabase_postgres_data:
    name: nextphoton_metabase_postgres_data

# =============================================================================
# Networks
# =============================================================================
networks:
  nextphoton-bi:
    name: nextphoton-bi-network
    external: true
