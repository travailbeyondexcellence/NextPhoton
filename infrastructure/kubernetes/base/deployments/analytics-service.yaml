---
# Analytics Service Deployment
# Processes learning analytics, progress tracking, reporting
# Event-driven batch processing for insights generation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: nextphoton
  labels:
    app: analytics-service
    component: analytics
    tier: backend
    version: v1
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: analytics-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: analytics-service
        component: analytics
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: analytics-service
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: analytics-service
          image: ghcr.io/nextphoton/analytics-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: environment
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: log-level
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: analytics-database-url
                  optional: true
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: nats-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-url
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: otel-endpoint
            # ClickHouse for analytics (optional)
            - name: CLICKHOUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: clickhouse-host
                  optional: true
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: clickhouse-database
                  optional: true
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: clickhouse-username
                  optional: true
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: clickhouse-password
                  optional: true
            # Processing configuration
            - name: ANALYTICS_BATCH_SIZE
              value: "1000"
            - name: ANALYTICS_FLUSH_INTERVAL
              value: "30s"
            - name: ANALYTICS_WORKERS
              value: "3"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      imagePullSecrets:
        - name: ghcr-credentials
---
# Pod Disruption Budget for Analytics Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics-service-pdb
  namespace: nextphoton
  labels:
    app: analytics-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: analytics-service
---
# Service Account for Analytics Service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service
  namespace: nextphoton
  labels:
    app: analytics-service
