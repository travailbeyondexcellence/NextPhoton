---
# Media Service Deployment
# Handles file uploads, media processing, session recordings
# Integrates with Cloudflare R2 for object storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: nextphoton
  labels:
    app: media-service
    component: media
    tier: backend
    version: v1
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: media-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: media-service
        component: media
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: media-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: media-service
          image: ghcr.io/nextphoton/media-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: environment
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: log-level
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: nats-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-url
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: otel-endpoint
            # Cloudflare R2 Storage
            - name: CLOUDFLARE_R2_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: r2-endpoint
            - name: CLOUDFLARE_R2_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudflare-secrets
                  key: r2-access-key
            - name: CLOUDFLARE_R2_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudflare-secrets
                  key: r2-secret-key
            - name: CLOUDFLARE_R2_BUCKET_UPLOADS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: r2-bucket-uploads
            - name: CLOUDFLARE_R2_BUCKET_MEDIA
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: r2-bucket-media
            - name: CLOUDFLARE_R2_BUCKET_RECORDINGS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: r2-bucket-recordings
            # Media processing configuration
            - name: MAX_UPLOAD_SIZE
              value: "104857600"  # 100MB
            - name: ALLOWED_FILE_TYPES
              value: "image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            - name: IMAGE_MAX_WIDTH
              value: "4096"
            - name: IMAGE_MAX_HEIGHT
              value: "4096"
            - name: THUMBNAIL_WIDTH
              value: "200"
            - name: THUMBNAIL_HEIGHT
              value: "200"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 2Gi
      imagePullSecrets:
        - name: ghcr-credentials
---
# Pod Disruption Budget for Media Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: media-service-pdb
  namespace: nextphoton
  labels:
    app: media-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: media-service
---
# Horizontal Pod Autoscaler for Media Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-service-hpa
  namespace: nextphoton
  labels:
    app: media-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
# Service Account for Media Service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-service
  namespace: nextphoton
  labels:
    app: media-service
