---
# Media Service
# Internal service for media processing and file uploads
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: nextphoton
  labels:
    app: media-service
    component: media
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: media-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: None
