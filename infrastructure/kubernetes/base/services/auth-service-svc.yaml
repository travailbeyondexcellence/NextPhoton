---
# Auth Service
# Internal service for authentication and authorization
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nextphoton
  labels:
    app: auth-service
    component: auth
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: None
