---
# Notification Service
# Internal service for notification processing
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: nextphoton
  labels:
    app: notification-service
    component: notification
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: None
