---
# External Secrets Operator Configuration
# Syncs secrets from HashiCorp Vault to Kubernetes
# Requires External Secrets Operator to be installed in the cluster
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
spec:
  provider:
    vault:
      server: "https://vault.nextphoton.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "nextphoton-app"
          serviceAccountRef:
            name: "external-secrets-sa"
---
# External Secret for Application Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets-external
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef:
        key: nextphoton/database
        property: url
    - secretKey: analytics-database-url
      remoteRef:
        key: nextphoton/database
        property: analytics-url
    - secretKey: redis-url
      remoteRef:
        key: nextphoton/redis
        property: url
    - secretKey: jwt-secret
      remoteRef:
        key: nextphoton/auth
        property: jwt-secret
---
# External Secret for OAuth Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth-secrets-external
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: oauth-secrets
    creationPolicy: Owner
  data:
    - secretKey: google-client-id
      remoteRef:
        key: nextphoton/oauth/google
        property: client-id
    - secretKey: google-client-secret
      remoteRef:
        key: nextphoton/oauth/google
        property: client-secret
---
# External Secret for Payment Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-secrets-external
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: payment-secrets
    creationPolicy: Owner
  data:
    - secretKey: stripe-secret-key
      remoteRef:
        key: nextphoton/stripe
        property: secret-key
    - secretKey: stripe-webhook-secret
      remoteRef:
        key: nextphoton/stripe
        property: webhook-secret
---
# External Secret for Notification Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-secrets-external
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: notification-secrets
    creationPolicy: Owner
  data:
    - secretKey: sendgrid-api-key
      remoteRef:
        key: nextphoton/notifications/sendgrid
        property: api-key
    - secretKey: resend-api-key
      remoteRef:
        key: nextphoton/notifications/resend
        property: api-key
    - secretKey: twilio-account-sid
      remoteRef:
        key: nextphoton/notifications/twilio
        property: account-sid
    - secretKey: twilio-auth-token
      remoteRef:
        key: nextphoton/notifications/twilio
        property: auth-token
    - secretKey: twilio-phone-number
      remoteRef:
        key: nextphoton/notifications/twilio
        property: phone-number
    - secretKey: firebase-credentials
      remoteRef:
        key: nextphoton/notifications/firebase
        property: credentials
---
# External Secret for Cloudflare Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-secrets-external
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: cloudflare-secrets
    creationPolicy: Owner
  data:
    - secretKey: r2-access-key
      remoteRef:
        key: nextphoton/cloudflare/r2
        property: access-key
    - secretKey: r2-secret-key
      remoteRef:
        key: nextphoton/cloudflare/r2
        property: secret-key
    - secretKey: api-token
      remoteRef:
        key: nextphoton/cloudflare
        property: api-token
---
# Service Account for External Secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
