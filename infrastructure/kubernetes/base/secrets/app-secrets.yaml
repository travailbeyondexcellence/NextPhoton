---
# Application Secrets - Template
# In production, use External Secrets Operator to sync from Vault/AWS Secrets Manager
# This file serves as a template showing required secret keys
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
type: Opaque
stringData:
  # Database Connection (NeonDB)
  # Format: postgresql://user:password@host:5432/database?sslmode=require
  database-url: "REPLACE_WITH_ACTUAL_DATABASE_URL"

  # Analytics Database (Optional - for dedicated analytics DB)
  analytics-database-url: "REPLACE_WITH_ACTUAL_ANALYTICS_DATABASE_URL"

  # Redis Connection
  redis-url: "REPLACE_WITH_ACTUAL_REDIS_URL"

  # JWT Secret (must be at least 256 bits / 32 characters for HS256)
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET_AT_LEAST_32_CHARS"
---
# OAuth Secrets
apiVersion: v1
kind: Secret
metadata:
  name: oauth-secrets
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
type: Opaque
stringData:
  google-client-id: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  google-client-secret: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
---
# Payment Provider Secrets (Stripe)
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
type: Opaque
stringData:
  stripe-secret-key: "REPLACE_WITH_STRIPE_SECRET_KEY"
  stripe-webhook-secret: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"
---
# Notification Provider Secrets
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
type: Opaque
stringData:
  # Email - SendGrid
  sendgrid-api-key: "REPLACE_WITH_SENDGRID_API_KEY"
  # Email - Resend
  resend-api-key: "REPLACE_WITH_RESEND_API_KEY"
  # SMS - Twilio
  twilio-account-sid: "REPLACE_WITH_TWILIO_ACCOUNT_SID"
  twilio-auth-token: "REPLACE_WITH_TWILIO_AUTH_TOKEN"
  twilio-phone-number: "REPLACE_WITH_TWILIO_PHONE_NUMBER"
  # Push - Firebase
  firebase-credentials: |
    {
      "type": "service_account",
      "project_id": "nextphoton-prod",
      "private_key_id": "REPLACE",
      "private_key": "REPLACE",
      "client_email": "REPLACE",
      "client_id": "REPLACE",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }
---
# Cloudflare R2 Secrets
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-secrets
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
type: Opaque
stringData:
  r2-access-key: "REPLACE_WITH_R2_ACCESS_KEY"
  r2-secret-key: "REPLACE_WITH_R2_SECRET_KEY"
  api-token: "REPLACE_WITH_CLOUDFLARE_API_TOKEN"
---
# WebRTC Secrets (TURN Server)
apiVersion: v1
kind: Secret
metadata:
  name: webrtc-secrets
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
type: Opaque
stringData:
  turn-username: "REPLACE_WITH_TURN_USERNAME"
  turn-credential: "REPLACE_WITH_TURN_CREDENTIAL"
---
# Analytics Secrets (ClickHouse)
apiVersion: v1
kind: Secret
metadata:
  name: analytics-secrets
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
type: Opaque
stringData:
  clickhouse-username: "nextphoton_analytics"
  clickhouse-password: "REPLACE_WITH_CLICKHOUSE_PASSWORD"
---
# Image Pull Secret for GitHub Container Registry
# This should be created separately using:
# kubectl create secret docker-registry ghcr-credentials \
#   --docker-server=ghcr.io \
#   --docker-username=USERNAME \
#   --docker-password=GITHUB_TOKEN \
#   --docker-email=EMAIL \
#   -n nextphoton
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
  namespace: nextphoton
  labels:
    app: nextphoton
    component: secrets
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded docker config json
  # Replace this or create the secret manually
  .dockerconfigjson: "REPLACE_WITH_BASE64_ENCODED_DOCKER_CONFIG"
