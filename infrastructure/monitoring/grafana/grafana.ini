# Grafana Configuration for NextPhoton EduCare Platform
# Production-ready configuration with security and performance optimizations

#################################### Server ####################################
[server]
# Protocol (http, https, h2, socket)
protocol = http

# The ip address to bind to, empty will bind to all interfaces
http_addr = 0.0.0.0

# The http port to use
http_port = 3000

# The public facing domain name used to access grafana from a browser
domain = grafana.nextphoton.com

# Redirect to correct domain if host header does not match domain
enforce_domain = false

# The full public facing url
root_url = %(protocol)s://%(domain)s:%(http_port)s/

# Serve Grafana from subpath specified in `root_url` setting
serve_from_sub_path = false

# Log web requests
router_logging = true

# Enable gzip
enable_gzip = true

#################################### Database ##################################
[database]
# You can configure the database connection by specifying type, host, name, user and password
# as separate properties or as on string using the url property.

# Either "mysql", "postgres" or "sqlite3"
type = postgres

# Database host and port (only applicable for mysql/postgres)
host = postgres:5432

# Database name
name = grafana

# Database user
user = grafana

# Database password (use env variable for security)
password = ${GF_DATABASE_PASSWORD}

# SSL mode for postgres (disable, require, verify-ca, verify-full)
ssl_mode = require

# Connection max idle time (seconds)
conn_max_idle_time = 14400

# Connection max lifetime (seconds)
conn_max_lifetime = 14400

# Set to true to log the sql calls and execution times
log_queries = false

#################################### Session ###################################
[session]
# Either "memory", "file", "redis", "mysql", "postgres", default is "file"
provider = redis

# Provider config options
# Redis: config like redis server e.g. `addr=127.0.0.1:6379,pool_size=100,db=grafana`
provider_config = addr=redis:6379,pool_size=100,db=0,password=${GF_SESSION_REDIS_PASSWORD}

# Session cookie name
cookie_name = grafana_session

# Session life time (seconds)
session_life_time = 86400

# Set to true if you host Grafana behind HTTPS
cookie_secure = true

# Set cookie SameSite attribute (lax, strict, none)
cookie_samesite = lax

#################################### Security ##################################
[security]
# Disable creation of admin user on first start of grafana
disable_initial_admin_creation = false

# Default admin user
admin_user = admin

# Default admin password (use env variable in production)
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}

# Used for signing
secret_key = ${GF_SECURITY_SECRET_KEY}

# Disable gravatar profile images
disable_gravatar = true

# Data source proxy whitelist (ip_or_domain:port separated by spaces)
data_source_proxy_whitelist =

# Disable protection against brute force login attempts
disable_brute_force_login_protection = false

# Set to true if you want to allow browsers to render Grafana in a <frame>, <iframe>, <embed> or <object>
allow_embedding = false

# Set to true if you want to enable http strict transport security (HSTS) response header
strict_transport_security = true

# Sets how long a browser should cache HSTS
strict_transport_security_max_age_seconds = 86400

# Set to true if to enable HSTS preloading option
strict_transport_security_preload = true

# Set to true if to enable the HSTS includeSubDomains option
strict_transport_security_subdomains = true

# Set to true to enable the X-Content-Type-Options response header
x_content_type_options = true

# Set to true to enable the X-XSS-Protection header
x_xss_protection = true

# Content security policy configuration
content_security_policy = true
content_security_policy_template = """script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src * data:;base-uri 'self';connect-src 'self' grafana.com ws://$ROOT_PATH wss://$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self';"""

#################################### Users #####################################
[users]
# Disable user signup / registration
allow_sign_up = false

# Allow non admin users to create organizations
allow_org_create = false

# Set to true to automatically assign new users to the default organization (id 1)
auto_assign_org = true

# Set this value to automatically add new users to the provided organization
auto_assign_org_id = 1

# Default role new users will be automatically assigned
auto_assign_org_role = Viewer

# Require email validation before sign up completes
verify_email_enabled = false

# Background text for the user field on the login page
login_hint = email or username

# Default UI theme ("dark" or "light")
default_theme = dark

# Path to a custom home page
home_page =

# External user management
external_manage_link_url =
external_manage_link_name =
external_manage_info =

# Viewers can edit/inspect dashboard settings in the browser (but not save)
viewers_can_edit = false

# Editors can administrate dashboard, folders and teams they create
editors_can_admin = true

# The duration in time a user invitation remains valid before expiring
user_invite_max_lifetime_duration = 24h

#################################### Anonymous Auth ############################
[auth.anonymous]
# Enable anonymous access
enabled = false

# Specify organization name that should be used for unauthenticated users
org_name = NextPhoton

# Specify role for unauthenticated users
org_role = Viewer

# Mask the Grafana version number for unauthenticated users
hide_version = true

#################################### Basic Auth ################################
[auth.basic]
enabled = true

#################################### Auth Proxy ################################
[auth.proxy]
enabled = false
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
sync_ttl = 60
whitelist =
headers = Email:X-User-Email, Name:X-User-Name

#################################### LDAP Auth #################################
[auth.ldap]
enabled = false
config_file = /etc/grafana/ldap.toml
allow_sign_up = true

#################################### SMTP / Emailing ###########################
[smtp]
enabled = true
host = ${GF_SMTP_HOST}
user = ${GF_SMTP_USER}
password = ${GF_SMTP_PASSWORD}
cert_file =
key_file =
skip_verify = false
from_address = grafana@nextphoton.com
from_name = NextPhoton Grafana
ehlo_identity =
startTLS_policy = MandatoryStartTLS

[emails]
welcome_email_on_sign_up = false
templates_pattern = emails/*.html, emails/*.txt

#################################### Logging ###################################
[log]
# Either "console", "file", "syslog"
mode = console file

# Either "debug", "info", "warn", "error", "critical"
level = info

# Optional settings to set different levels for specific loggers
filters = rendering:debug

[log.console]
level = info
format = json

[log.file]
level = info
format = json
log_rotate = true
max_lines = 1000000
max_size_shift = 28
daily_rotate = true
max_days = 7

#################################### Alerting ##################################
[alerting]
# Disable alerting engine & target all alert rules for evaluation
enabled = true

# Makes it possible to turn off alert rule execution but alerting UI is visible
execute_alerts = true

# Default setting for new alert rules
evaluation_timeout_seconds = 60

# Maximum number of times to retry a failed rule evaluation
notification_timeout_seconds = 30

# Default setting for new alert rules
max_attempts = 3

# Makes it possible to enforce a minimum interval between alert evaluations
min_interval_seconds = 10

#################################### Unified Alerting ##########################
[unified_alerting]
enabled = true

# Listen address and port for receiving alerts
admin_config_poll_interval = 60s

# The interval within which alerting rules may be scheduled
alertmanager_config_poll_interval = 60s

# Min retry backoff
min_retry_backoff = 10s

# Max retry backoff
max_retry_backoff = 30s

#################################### Explore ###################################
[explore]
enabled = true

#################################### Metrics ###################################
[metrics]
enabled = true
interval_seconds = 10

# Disable total stats (stat_totals_*) metrics to be generated
disable_total_stats = false

# If both are set, basic auth will be required for the metrics endpoint
basic_auth_username = metrics
basic_auth_password = ${GF_METRICS_BASIC_AUTH_PASSWORD}

[metrics.graphite]
# Enable by setting the address
address =
prefix = prod.grafana.%(instance)s.

#################################### Distributed tracing #######################
[tracing.jaeger]
# Enable distributed tracing with Jaeger
address = jaeger:6831
always_included_tag = app=grafana
sampler_type = const
sampler_param = 1
zipkin_propagation = false
disable_shared_zipkin_spans = false

[tracing.opentelemetry.otlp]
# Enable by setting address
address = otel-collector:4317

#################################### Grafana.com integration ###################
[grafana_com]
url = https://grafana.com

#################################### Analytics #################################
[analytics]
reporting_enabled = false
check_for_updates = false
google_analytics_ua_id =
google_tag_manager_id =

#################################### Dashboards ################################
[dashboards]
versions_to_keep = 20
min_refresh_interval = 5s
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/services-overview.json

#################################### Feature Toggles ###########################
[feature_toggles]
enable = publicDashboards tempoSearch tempoBackendSearch tempoServiceGraph traceqlEditor correlations metricsSummary traceToMetrics

#################################### Date Formats ##############################
[date_formats]
full_date = YYYY-MM-DD HH:mm:ss
interval_second = HH:mm:ss
interval_minute = HH:mm
interval_hour = MM/DD HH:mm
interval_day = MM/DD
interval_month = YYYY-MM
interval_year = YYYY

#################################### Panels ####################################
[panels]
disable_sanitize_html = false
enable_alpha = false

#################################### Plugins ###################################
[plugins]
enable_alpha = false
app_tls_skip_verify_insecure = false
allow_loading_unsigned_plugins =
plugin_admin_enabled = true
plugin_admin_external_manage_enabled = false
plugin_catalog_url = https://grafana.com/grafana/plugins/
plugin_catalog_hidden_plugins =

#################################### Live ######################################
[live]
max_connections = 100
allowed_origins = https://grafana.nextphoton.com
ha_engine =
ha_engine_address =
