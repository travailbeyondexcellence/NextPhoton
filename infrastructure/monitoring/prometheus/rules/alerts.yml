# Alert Rules for NextPhoton EduCare Platform
# Defines alerting rules for SLO violations, service health, and infrastructure issues

groups:
  # Service Level Objective (SLO) Alerts
  - name: nextphoton-slo-alerts
    interval: 30s
    rules:
      # High Error Rate Alert - triggers when error rate exceeds 1%
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(nextphoton_requests_total{status=~"5.."}[5m])) by (service)
            /
            sum(rate(nextphoton_requests_total[5m])) by (service)
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          team: platform
          slo: availability
        annotations:
          summary: "High error rate detected on {{ $labels.service }}"
          description: "Service {{ $labels.service }} has an error rate of {{ $value | humanizePercentage }} (threshold: 1%)"
          runbook_url: "https://runbooks.nextphoton.com/alerts/high-error-rate"
          dashboard_url: "https://grafana.nextphoton.com/d/services-overview"

      # High Latency Alert - triggers when P95 latency exceeds 500ms
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(nextphoton_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
          slo: latency
        annotations:
          summary: "High P95 latency on {{ $labels.service }}"
          description: "Service {{ $labels.service }} P95 latency is {{ $value | humanizeDuration }} (threshold: 500ms)"
          runbook_url: "https://runbooks.nextphoton.com/alerts/high-latency"
          dashboard_url: "https://grafana.nextphoton.com/d/services-overview"

      # Critical Latency Alert - triggers when P99 latency exceeds 1s
      - alert: CriticalLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(nextphoton_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 1
        for: 3m
        labels:
          severity: critical
          team: platform
          slo: latency
        annotations:
          summary: "Critical P99 latency on {{ $labels.service }}"
          description: "Service {{ $labels.service }} P99 latency is {{ $value | humanizeDuration }} (threshold: 1s)"
          runbook_url: "https://runbooks.nextphoton.com/alerts/critical-latency"

      # Error Budget Burn Rate - fast burn (2% of monthly budget in 1 hour)
      - alert: ErrorBudgetFastBurn
        expr: |
          (
            sum(rate(nextphoton_requests_total{status=~"5.."}[1h])) by (service)
            /
            sum(rate(nextphoton_requests_total[1h])) by (service)
          ) > 14.4 * 0.001
        for: 5m
        labels:
          severity: critical
          team: platform
          slo: error_budget
        annotations:
          summary: "Error budget fast burn on {{ $labels.service }}"
          description: "Service {{ $labels.service }} is burning error budget at 14.4x rate"

  # Service Health Alerts
  - name: nextphoton-service-health
    interval: 30s
    rules:
      # Service Down Alert
      - alert: ServiceDown
        expr: up{job="nextphoton-services"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "Service {{ $labels.service }} ({{ $labels.instance }}) has been unreachable for more than 1 minute"
          runbook_url: "https://runbooks.nextphoton.com/alerts/service-down"

      # Service Restart Alert
      - alert: ServiceFrequentRestarts
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="nextphoton"}[1h]) > 5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Frequent restarts for {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour"

      # Pod Not Ready Alert
      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{namespace="nextphoton", condition="true"} == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in a non-ready state for more than 5 minutes"

      # Deployment Replicas Mismatch
      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas{namespace="nextphoton"}
          !=
          kube_deployment_status_replicas_available{namespace="nextphoton"}
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Deployment {{ $labels.deployment }} replica mismatch"
          description: "Deployment {{ $labels.deployment }} has {{ $value }} available replicas, expected {{ $labels.spec_replicas }}"

  # Database Alerts
  - name: nextphoton-database-alerts
    interval: 30s
    rules:
      # Database Connection Pool Exhaustion
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          nextphoton_db_pool_connections_used
          /
          nextphoton_db_pool_connections_max
          > 0.9
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Database connection pool nearly exhausted on {{ $labels.service }}"
          description: "Service {{ $labels.service }} is using {{ $value | humanizePercentage }} of available database connections"
          runbook_url: "https://runbooks.nextphoton.com/alerts/db-pool-exhausted"

      # Database Connection Errors
      - alert: DatabaseConnectionErrors
        expr: |
          rate(nextphoton_db_connection_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Database connection errors on {{ $labels.service }}"
          description: "Service {{ $labels.service }} is experiencing {{ $value }} database connection errors per second"

      # Slow Database Queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            sum(rate(nextphoton_db_query_duration_seconds_bucket[5m])) by (le, service, query)
          ) > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow database queries on {{ $labels.service }}"
          description: "Query {{ $labels.query }} on {{ $labels.service }} P95 latency is {{ $value | humanizeDuration }}"

      # PostgreSQL Connection Issues
      - alert: PostgreSQLConnectionIssues
        expr: |
          pg_up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL connection failed"
          description: "Cannot connect to PostgreSQL database"

      # PostgreSQL High Connections
      - alert: PostgreSQLHighConnections
        expr: |
          pg_stat_activity_count
          /
          pg_settings_max_connections
          > 0.8
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL connection count high"
          description: "PostgreSQL is using {{ $value | humanizePercentage }} of max connections"

  # Message Queue Alerts (NATS JetStream)
  - name: nextphoton-queue-alerts
    interval: 30s
    rules:
      # Queue Depth Too High
      - alert: QueueDepthHigh
        expr: |
          nats_jetstream_consumer_num_pending > 10000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High queue depth on {{ $labels.stream }}/{{ $labels.consumer }}"
          description: "Queue {{ $labels.stream }}/{{ $labels.consumer }} has {{ $value }} pending messages"
          runbook_url: "https://runbooks.nextphoton.com/alerts/queue-depth-high"

      # Queue Depth Critical
      - alert: QueueDepthCritical
        expr: |
          nats_jetstream_consumer_num_pending > 50000
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Critical queue depth on {{ $labels.stream }}/{{ $labels.consumer }}"
          description: "Queue {{ $labels.stream }}/{{ $labels.consumer }} has {{ $value }} pending messages - consumers may be down"

      # Consumer Lag
      - alert: ConsumerLagHigh
        expr: |
          nats_jetstream_consumer_num_ack_pending > 1000
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High consumer lag on {{ $labels.stream }}/{{ $labels.consumer }}"
          description: "Consumer {{ $labels.consumer }} has {{ $value }} unacknowledged messages"

      # NATS Server Down
      - alert: NATSServerDown
        expr: |
          up{job="nats"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "NATS server is down"
          description: "NATS messaging server is unreachable"

  # Infrastructure Alerts
  - name: nextphoton-infrastructure-alerts
    interval: 30s
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: |
          (
            sum(rate(container_cpu_usage_seconds_total{namespace="nextphoton"}[5m])) by (pod)
            /
            sum(kube_pod_container_resource_limits{resource="cpu", namespace="nextphoton"}) by (pod)
          ) > 0.9
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage on {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of CPU limit"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          (
            container_memory_working_set_bytes{namespace="nextphoton"}
            /
            kube_pod_container_resource_limits{resource="memory", namespace="nextphoton"}
          ) > 0.9
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of memory limit"
          runbook_url: "https://runbooks.nextphoton.com/alerts/high-memory"

      # Container OOM Killed
      - alert: ContainerOOMKilled
        expr: |
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace="nextphoton"} == 1
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Container {{ $labels.container }} was OOM killed"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} was killed due to OOM"

      # Disk Usage High
      - alert: DiskUsageHigh
        expr: |
          (
            kubelet_volume_stats_used_bytes{namespace="nextphoton"}
            /
            kubelet_volume_stats_capacity_bytes{namespace="nextphoton"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High disk usage on {{ $labels.persistentvolumeclaim }}"
          description: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

      # Disk Usage Critical
      - alert: DiskUsageCritical
        expr: |
          (
            kubelet_volume_stats_used_bytes{namespace="nextphoton"}
            /
            kubelet_volume_stats_capacity_bytes{namespace="nextphoton"}
          ) > 0.95
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Critical disk usage on {{ $labels.persistentvolumeclaim }}"
          description: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full - immediate action required"

  # Redis Alerts
  - name: nextphoton-redis-alerts
    interval: 30s
    rules:
      # Redis Down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis is down"
          description: "Redis cache server is unreachable"

      # Redis Memory High
      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{ $value | humanizePercentage }} of available memory"

      # Redis Connection Rejected
      - alert: RedisConnectionsRejected
        expr: |
          increase(redis_rejected_connections_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis rejecting connections"
          description: "Redis has rejected {{ $value }} connections in the last 5 minutes"

  # API Gateway Alerts
  - name: nextphoton-gateway-alerts
    interval: 30s
    rules:
      # Gateway Error Rate
      - alert: GatewayHighErrorRate
        expr: |
          sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))
          /
          sum(rate(traefik_service_requests_total[5m]))
          > 0.01
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "API Gateway experiencing high error rate"
          description: "Gateway error rate is {{ $value | humanizePercentage }}"

      # Gateway High Latency
      - alert: GatewayHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "API Gateway experiencing high latency"
          description: "Gateway P95 latency is {{ $value | humanizeDuration }}"

      # Gateway Rate Limiting Active
      - alert: GatewayRateLimitingActive
        expr: |
          sum(rate(traefik_service_requests_total{code="429"}[5m])) > 10
        for: 5m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "API Gateway rate limiting active"
          description: "Gateway is rate limiting {{ $value }} requests per second"

  # Certificate Alerts
  - name: nextphoton-certificate-alerts
    interval: 1h
    rules:
      # Certificate Expiring Soon
      - alert: CertificateExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "SSL certificate expiring soon for {{ $labels.instance }}"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value }} days"

      # Certificate Expiring Critical
      - alert: CertificateExpiringCritical
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
        for: 1h
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "SSL certificate expiring very soon for {{ $labels.instance }}"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value }} days - immediate renewal required"
