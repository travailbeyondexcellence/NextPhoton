# NextPhoton Services Static Targets
# This file defines static scrape targets for NextPhoton services
# Used when Kubernetes service discovery is not available (e.g., docker-compose)

# Authentication Service
- targets:
    - auth-service:9090
  labels:
    service: auth-service
    team: platform
    environment: production

# User Service
- targets:
    - user-service:9090
  labels:
    service: user-service
    team: platform
    environment: production

