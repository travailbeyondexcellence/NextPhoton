    - name: PAYMENT_PROVIDER
      value: "stripe"

# -----------------------------------------------------------------------------
# Analytics Service
# -----------------------------------------------------------------------------
analytics-service:
  enabled: true
  replicaCount: 1
  image:
    repository: analytics-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    grpcPort: 9000
    metricsPort: 9090
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# -----------------------------------------------------------------------------
# Notification Service
# -----------------------------------------------------------------------------
notification-service:
  enabled: true
  replicaCount: 1
  image:
    repository: notification-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    grpcPort: 9000
    metricsPort: 9090
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  env:
    - name: EMAIL_PROVIDER
      value: "sendgrid"
    - name: SMS_PROVIDER
      value: "twilio"

# -----------------------------------------------------------------------------
# Media Service
# -----------------------------------------------------------------------------
media-service:
  enabled: true
  replicaCount: 2
  image:
    repository: media-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    grpcPort: 9000
    metricsPort: 9090
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  env:
    - name: STORAGE_PROVIDER
      value: "cloudflare-r2"
    - name: MAX_UPLOAD_SIZE
      value: "100MB"

# -----------------------------------------------------------------------------
# ConfigMap Settings
# -----------------------------------------------------------------------------
configMap:
  # Common configuration shared across services
  common:
    NATS_URL: "nats://nats:4222"
    REDIS_URL: "redis://redis-master:6379"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ENVIRONMENT: "development"

# -----------------------------------------------------------------------------
# External Secrets Configuration
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  secrets:
    - name: database-credentials
      remoteRef:
        key: nextphoton/database
        property: url
    - name: auth-secrets
      remoteRef:
        key: nextphoton/auth
    - name: redis-credentials
      remoteRef:
        key: nextphoton/redis
    - name: nats-credentials
      remoteRef:
        key: nextphoton/nats
    - name: payment-secrets
      remoteRef:
        key: nextphoton/payments
    - name: notification-secrets
      remoteRef:
        key: nextphoton/notifications

# -----------------------------------------------------------------------------
# Service Account Configuration
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: nextphoton-sa
  annotations:
    # For AWS IAM roles for service accounts (IRSA)
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/nextphoton-role
    # For GCP Workload Identity
    # iam.gke.io/gcp-service-account: nextphoton@PROJECT.iam.gserviceaccount.com

# -----------------------------------------------------------------------------
# Network Policies
# -----------------------------------------------------------------------------
networkPolicies:
  enabled: true
  # Allow traffic only within namespace by default
  defaultDeny: true

# -----------------------------------------------------------------------------
# Pod Annotations
# -----------------------------------------------------------------------------
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

# -----------------------------------------------------------------------------
# Node Selector (optional)
# -----------------------------------------------------------------------------
nodeSelector: {}

# -----------------------------------------------------------------------------
# Tolerations (optional)
# -----------------------------------------------------------------------------
tolerations: []

# -----------------------------------------------------------------------------
# Affinity Rules (optional)
# -----------------------------------------------------------------------------
affinity: {}

# -----------------------------------------------------------------------------
# Priority Class
# -----------------------------------------------------------------------------
priorityClassName: ""

# -----------------------------------------------------------------------------
# Migration Job Configuration
# -----------------------------------------------------------------------------
migrations:
  enabled: true
  image:
    repository: migrations
    tag: "1.0.0"
  backoffLimit: 3
  activeDeadlineSeconds: 300
