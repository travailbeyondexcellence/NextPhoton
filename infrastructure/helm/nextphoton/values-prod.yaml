# -----------------------------------------------------------------------------
# ConfigMap Settings - Production
# -----------------------------------------------------------------------------
configMap:
  common:
    NATS_URL: "nats://nats:4222"
    REDIS_URL: "redis://redis-master:6379"
    ENVIRONMENT: "production"
    ENABLE_PROFILING: "false"

# -----------------------------------------------------------------------------
# External Secrets - Production
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore

# -----------------------------------------------------------------------------
# Network Policies - Production
# -----------------------------------------------------------------------------
networkPolicies:
  enabled: true
  defaultDeny: true

# -----------------------------------------------------------------------------
# Priority Class - Production
# -----------------------------------------------------------------------------
priorityClassName: high-priority

# -----------------------------------------------------------------------------
# Node Affinity - Production
# -----------------------------------------------------------------------------
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-type
              operator: In
              values:
                - application

# -----------------------------------------------------------------------------
# Migration Job - Production
# -----------------------------------------------------------------------------
migrations:
  enabled: true
  image:
    tag: "1.0.0"
  backoffLimit: 5
  activeDeadlineSeconds: 600
