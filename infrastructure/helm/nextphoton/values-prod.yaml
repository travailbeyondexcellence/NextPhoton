# -----------------------------------------------------------------------------
# Analytics Service - Production
# -----------------------------------------------------------------------------
analytics-service:
  enabled: true
  replicaCount: 2
  image:
    tag: "1.0.0"
  resources:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: 1500m
      memory: 3Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# -----------------------------------------------------------------------------
# Notification Service - Production
# -----------------------------------------------------------------------------
notification-service:
  enabled: true
  replicaCount: 2
  image:
    tag: "1.0.0"
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 750m
      memory: 768Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  env:
    - name: EMAIL_PROVIDER
      value: "sendgrid"
    - name: SMS_PROVIDER
      value: "twilio"
    - name: SMS_ENABLED
      value: "true"

# -----------------------------------------------------------------------------
# Media Service - Production
# -----------------------------------------------------------------------------
media-service:
