apiVersion: v2
name: nextphoton
description: NextPhoton EduCare Platform - A comprehensive Helm chart for deploying the NextPhoton microservices architecture
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - nextphoton
  - educare
  - education
  - microservices
  - kubernetes
home: https://github.com/nextphoton/nextphoton
sources:
  - https://github.com/nextphoton/nextphoton
maintainers:
  - name: NextPhoton Team
    email: devops@nextphoton.io
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.nextphoton.io
    - name: Support
      url: https://support.nextphoton.io

# Dependencies for the NextPhoton platform
dependencies:
  # Sub-charts for microservices
  - name: api-gateway
    version: "1.0.0"
    repository: "file://charts/api-gateway"
    condition: api-gateway.enabled

  - name: auth-service
    version: "1.0.0"
    repository: "file://charts/auth-service"
    condition: auth-service.enabled

  - name: user-service
    version: "1.0.0"
    repository: "file://charts/user-service"
    condition: user-service.enabled

  - name: session-service
    version: "1.0.0"
    repository: "file://charts/session-service"
    condition: session-service.enabled

  - name: payment-service
    version: "1.0.0"
    repository: "file://charts/payment-service"
    condition: payment-service.enabled

  - name: analytics-service
    version: "1.0.0"
    repository: "file://charts/analytics-service"
    condition: analytics-service.enabled

  - name: notification-service
    version: "1.0.0"
    repository: "file://charts/notification-service"
    condition: notification-service.enabled

  - name: media-service
    version: "1.0.0"
    repository: "file://charts/media-service"
    condition: media-service.enabled

  # External dependencies (optional - can use existing installations)
  - name: nats
    version: "1.1.x"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
    alias: nats

  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
    alias: redis

  - name: postgresql
    version: "14.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
    alias: postgresql
