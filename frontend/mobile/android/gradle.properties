# NextPhoton EduCare Android Application
# Gradle Properties Configuration

# Project-wide Gradle settings
# These settings are used by all Gradle builds in this project

# Enables AndroidX libraries instead of legacy support libraries
android.useAndroidX=true

# Enables Jetpack Compose
android.enableJetifier=false

# Kotlin code style for this project
kotlin.code.style=official

# Enable non-transitive R classes for better build performance
android.nonTransitiveRClass=true

# JVM Arguments for Gradle daemon
# Increase heap size for better build performance
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable parallel builds for faster compilation
org.gradle.parallel=true

# Enable configuration caching for faster builds
org.gradle.configuration-cache=true

# Enable build caching
org.gradle.caching=true

# Kotlin compiler incremental compilation
kotlin.incremental=true

# Enable new Kotlin IC for better incremental compilation
kotlin.incremental.useClasspathSnapshot=true

# Apollo GraphQL configuration
# Service name for code generation
apollo.service=nextphoton
